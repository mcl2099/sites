<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphism Profile Card — HTML, CSS & JavaScript</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Elementos de Luz e Fundo para Evidenciar o Efeito de Vidro (Glassmorphism) -->
  <div class="background-decorations">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <!-- Container com Perspectiva 3D -->
  <div class="card-container" id="cardContainer">
    
    <!-- O Card com Efeito de Vidro Fosco (Glassmorphism) -->
    <div class="glass-card" id="glassCard">
      
      <!-- Efeito de Brilho Dinâmico (Specular Glare) que segue o mouse -->
      <div class="glare" id="cardGlare"></div>

      <!-- Topo: Selo de Verificação e Tag -->
      <div class="card-header">
        <span class="badge-status">
          <span class="pulse-dot"></span>
          Disponível para Projetos
        </span>
        <button class="icon-menu-btn" title="Opções" aria-label="Mais opções">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="1"></circle>
            <circle cx="19" cy="12" r="1"></circle>
            <circle cx="5" cy="12" r="1"></circle>
          </svg>
        </button>
      </div>

      <!-- Avatar com Anel Translúcido -->
      <div class="avatar-wrapper">
        <div class="avatar-ring">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" alt="Foto de Perfil" class="avatar-img">
        </div>
        <div class="verified-badge" title="Criador Verificado">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
          </svg>
        </div>
      </div>

      <!-- Informações do Usuário -->
      <div class="profile-info">
        <h2 class="profile-name">Valéria Mendes</h2>
        <p class="profile-handle">@valeriamendes • Estrategista Visual</p>
        <p class="profile-bio">
          Arquiteta de retenção de audiência e narrativa de alto ticket. Transformando vídeos curtos em ecossistemas de vendas previsíveis.
        </p>
      </div>

      <!-- Grade de Estatísticas / Métricas -->
      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-value">185K</span>
          <span class="stat-label">Seguidores</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-value">+218%</span>
          <span class="stat-label">Retenção</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-value">4.9 ★</span>
          <span class="stat-label">Avaliação</span>
        </div>
      </div>

      <!-- Ações: Botões de Seguir e Mensagem -->
      <div class="card-actions">
        <button class="btn btn-primary" id="btnFollow">
          <span class="btn-text">Conectar</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <button class="btn btn-secondary" id="btnMessage" title="Enviar Mensagem">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </button>
      </div>

      <!-- Links Sociais com Efeito Vidro -->
      <div class="social-links">
        <a href="#" class="social-btn" title="Instagram" aria-label="Instagram">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </a>
        <a href="#" class="social-btn" title="LinkedIn" aria-label="LinkedIn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
            <rect x="2" y="9" width="4" height="12"></rect>
            <circle cx="4" cy="4" r="2"></circle>
          </svg>
        </a>
        <a href="#" class="social-btn" title="YouTube" aria-label="YouTube">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path>
            <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon>
          </svg>
        </a>
        <a href="#" class="social-btn" title="Website Oficial" aria-label="Website">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
        </a>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
